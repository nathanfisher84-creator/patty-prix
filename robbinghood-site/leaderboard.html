<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GETAWAY RUN Leaderboard 🏆 — $ROBBINGHOOD</title>
<meta name="description" content="This week's GETAWAY RUN standings — the cleanest getaways on the $ROBBINGHOOD arcade." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    /* brand:theme */
    --bg: #060A04; --card: #0B140A; --stripe: #101D0C; --edge: #2A5220;
    --ink: #DDFFD2; --sub: #7BA86B; --accent: #00C805; --accent2: #C6E829;
    --red: #FF4655; --accent-rgb: 0, 200, 5; --accent2-rgb: 198, 232, 41;
/* /brand:theme */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: radial-gradient(800px 400px at 80% -80px, rgba(var(--accent-rgb),0.07), transparent 60%), var(--bg);
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 14px 50px;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
  }
  body > * { position: relative; z-index: 1; }
  h1 {
    font-family: 'VT323', monospace; font-weight: 400;
    font-size: clamp(32px, 8vw, 48px);
    color: var(--accent);
    text-shadow: 0 0 18px rgba(var(--accent-rgb),0.55);
    text-align: center;
    letter-spacing: 2px;
  }
  .sub { font-size: 13px; color: var(--sub); margin: 6px 0 4px; text-align: center; }
  .prize {
    margin: 14px 0 20px; max-width: 400px; text-align: center;
    background: var(--card);
    border: 2px solid var(--edge); border-radius: 10px;
    padding: 12px 18px; font-size: 12.5px; color: var(--sub);
  }
  .prize b { color: var(--accent); font-weight: 400; }
  .board {
    width: min(440px, 100%);
    background: var(--card);
    border: 2px solid var(--edge); border-radius: 12px;
    box-shadow: 0 0 18px rgba(var(--accent-rgb),0.14);
    padding: 16px 18px;
  }
  .board .head {
    display: flex; justify-content: space-between;
    font-size: 13px; letter-spacing: 1px; color: var(--accent);
    padding-bottom: 8px; border-bottom: 2px solid var(--edge); margin-bottom: 4px;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 2px; font-size: 14px;
  }
  .row + .row { border-top: 1.5px dashed rgba(var(--accent-rgb),0.12); }
  .row .rank { width: 34px; color: var(--accent2); }
  .row .addr { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .score { color: var(--accent); }
  .row.podium { background: rgba(var(--accent-rgb),0.07); border-radius: 8px; padding-left: 8px; padding-right: 8px; }
  .empty { text-align: center; color: var(--sub); padding: 26px 10px; font-size: 13.5px; }
  .meta { margin-top: 12px; font-size: 11.5px; color: var(--sub); text-align: center; opacity: 0.8; }
  .links { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: 'Share Tech Mono', monospace; font-size: 15px;
    background: var(--accent); color: #001505;
    border: 2px solid var(--accent); border-radius: 8px;
    padding: 11px 22px; cursor: pointer;
    text-decoration: none; display: inline-block;
    box-shadow: 0 0 16px rgba(var(--accent-rgb),0.35);
  }
  .btn:active { transform: translate(1px, 1px); }
  .btn.plain { background: var(--card); color: var(--ink); border-color: var(--edge); box-shadow: none; font-size: 13px; }
  .btn.plain:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <h1>GETAWAY RUN 🏆</h1>
  <div class="sub" id="weekLabel">weekly leaderboard</div>
  <div class="prize">⚡ scores post under your auto-assigned bot tag · board resets every Monday (UTC)
    · <b>weekly rewards TBA</b></div>

  <div class="board">
    <div class="head"><span>RUNNER</span><span>BEST SCORE</span></div>
    <div id="rows"></div>
    <div class="empty" id="empty" hidden>no scores yet this week —<br>be the first bot in the block ⚡</div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="links">
    <a class="btn" href="game.html">⚡ START THE GETAWAY</a>
    <a class="btn plain" href="index.html">← back to $ROBBINGHOOD</a>
  </div>

<script>
"use strict";
const TRACKED_HOST = /(\.vercel\.app|(^|\.)robbinghood\.xyz)$/.test(location.hostname);
const LB_API = TRACKED_HOST ? "/api/leaderboard" : "https://robbinghood.vercel.app/api/leaderboard";
const MEDALS = ["🥇", "🥈", "🥉"];

async function load() {
  try {
    const j = await (await fetch(LB_API)).json();
    if (!Array.isArray(j.top)) throw new Error(j.error || "bad response");
    document.getElementById("weekLabel").textContent =
      "week " + (j.week || "").split("-W")[1] + " · " + j.week;
    const rows = document.getElementById("rows");
    rows.textContent = "";
    document.getElementById("empty").hidden = j.top.length > 0;
    j.top.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "row" + (i < 3 ? " podium" : "");
      const rank = document.createElement("span");
      rank.className = "rank"; rank.textContent = MEDALS[i] || "#" + (i + 1);
      const addr = document.createElement("span");
      addr.className = "addr"; addr.title = r.name;
      addr.textContent = r.name;
      const score = document.createElement("span");
      score.className = "score"; score.textContent = r.score.toLocaleString();
      row.append(rank, addr, score);
      rows.appendChild(row);
    });
    document.getElementById("meta").textContent =
      "updated " + new Date().toLocaleTimeString() + " · refreshes every 30s";
  } catch {
    document.getElementById("meta").textContent = "leaderboard unreachable — retrying…";
  }
}
load();
setInterval(load, 30000);

window.__lb = { load };
</script>
</body>
</html>
