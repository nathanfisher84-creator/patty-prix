<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    /* brand:theme */
    --bg: #060A04; --card: #0B140A; --stripe: #101D0C; --edge: #2A5220;
    --ink: #DDFFD2; --sub: #7BA86B; --accent: #00C805; --accent2: #C6E829;
    --red: #FF4655; --accent-rgb: 0, 200, 5; --accent2-rgb: 198, 232, 41;
/* /brand:theme */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(800px 400px at 80% -80px, rgba(var(--accent-rgb),0.07), transparent 60%), var(--bg);
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    color: var(--ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
  }
  .card {
    background: var(--card);
    border: 2px solid var(--edge); border-radius: 12px;
    box-shadow: 0 0 24px rgba(var(--accent-rgb),0.18);
    padding: 44px 34px;
    max-width: 440px;
    text-align: center;
    position: relative; z-index: 1;
  }
  .glyph { font-size: 58px; animation: bob 2.2s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  h1 {
    font-family: 'VT323', monospace; font-weight: 400;
    font-size: clamp(34px, 9vw, 48px);
    color: var(--accent);
    text-shadow: 0 0 18px rgba(var(--accent-rgb),0.55);
    margin: 10px 0 12px;
    letter-spacing: 2px;
  }
  p { font-size: 14px; color: var(--sub); line-height: 1.55; }
  .cursor::after { content: "▮"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pill {
    display: inline-block; margin-top: 20px;
    font-size: 13px; letter-spacing: 1px;
    background: #04100A; color: var(--accent);
    border: 2px solid var(--edge); border-radius: 6px;
    padding: 9px 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="glyph">💰</span>
    <h1>SYSTEM UPGRADE</h1>
    <p>&gt; robbinghood slipped out the back door.<br>
       &gt; counting the bags…<br>
       <span class="cursor">&gt; the buy button is disabled</span></p>
    <span class="pill">💰 $ROBBINGHOOD — back online soon</span>
  </div>
</body>
