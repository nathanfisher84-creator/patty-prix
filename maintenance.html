<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg: #030905; --card: #08130C; --edge: #1D5232; --ink: #CDFFD9; --sub: #63A377; --green: #00FF41; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(800px 400px at 80% -80px, rgba(0,255,65,0.07), transparent 60%), var(--bg);
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    color: var(--ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
  }
  .card {
    background: var(--card);
    border: 2px solid var(--edge); border-radius: 12px;
    box-shadow: 0 0 24px rgba(0,255,65,0.18);
    padding: 44px 34px;
    max-width: 440px;
    text-align: center;
    position: relative; z-index: 1;
  }
  .glyph { font-size: 58px; animation: bob 2.2s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  h1 {
    font-family: 'VT323', monospace; font-weight: 400;
    font-size: clamp(34px, 9vw, 48px);
    color: var(--green);
    text-shadow: 0 0 18px rgba(0,255,65,0.55);
    margin: 10px 0 12px;
    letter-spacing: 2px;
  }
  p { font-size: 14px; color: var(--sub); line-height: 1.55; }
  .cursor::after { content: "▮"; color: var(--green); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pill {
    display: inline-block; margin-top: 20px;
    font-size: 13px; letter-spacing: 1px;
    background: #04100A; color: var(--green);
    border: 2px solid var(--edge); border-radius: 6px;
    padding: 9px 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="glyph">👨‍💻</span>
    <h1>SYSTEM UPGRADE</h1>
    <p>&gt; jared went back into the mempool.<br>
       &gt; deploying new extraction contracts…<br>
