<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Patty PFP Maker 🕶️</title>
<meta name="description" content="Put the Bagworker's shades on your profile pic. All in your browser — nothing gets uploaded." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%95%B6%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5C8DE; --card: #FBF4E4; --ink: #17130E; --sub: #6E675C;
    --pill: #5F4BE0; --gold: #FFC93C; --fill: #7ED3F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background:
      radial-gradient(800px 400px at 80% -80px, rgba(255,255,255,0.5), transparent 60%),
      var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 14px 50px;
    overscroll-behavior: none;
  }
  h1 {
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: clamp(26px, 7vw, 38px);
    text-shadow: 3px 3px 0 rgba(255,255,255,0.8), 5px 5px 0 rgba(23,19,14,0.15);
    margin-bottom: 4px;
  }
  .sub { font-weight: 800; font-size: 14px; color: var(--sub); margin-bottom: 18px; text-align: center; }
  .frame {
    position: relative;
    width: min(92vw, 420px); height: min(92vw, 420px);
    border: 3px solid var(--ink); border-radius: 22px;
    box-shadow: 8px 8px 0 var(--ink);
    background: var(--card);
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .drop {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
  }
  .drop p { font-weight: 800; color: var(--sub); font-size: 14px; }
  .btn {
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px;
    background: linear-gradient(160deg, #FFE18A, var(--gold)); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 12px 26px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.blue { background: var(--fill); }
  .btn.small { font-size: 14px; padding: 8px 16px; background: var(--card); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
  .hint { margin-top: 12px; font-weight: 800; font-size: 12.5px; color: var(--sub); text-align: center; max-width: 340px; }
</style>
</head>
<body>
  <h1>PATTY PFP MAKER 🕶️</h1>
  <div class="sub">put the Bagworker's shades on anything</div>

  <div class="frame" id="frame">
    <canvas id="cv" width="1024" height="1024"></canvas>
    <div class="drop" id="drop">
      <div style="font-size:56px">🖼️</div>
      <label class="btn" for="file">UPLOAD A PIC</label>
      <p>your photo stays on your device —<br>nothing is uploaded anywhere</p>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden />

  <div class="controls" id="controls" hidden>
    <button class="btn small" id="smaller">−</button>
    <button class="btn small" id="bigger">＋</button>
    <button class="btn small" id="rotL">⟲</button>
    <button class="btn small" id="rotR">⟳</button>
    <button class="btn small" id="flip">↔️ flip</button>
    <label class="btn small" for="file">new pic</label>
    <button class="btn blue" id="download">DOWNLOAD ⬇️</button>
  </div>
  <div class="hint" id="hint" hidden>drag the shades into place · pinch to resize &amp; tilt ·
    if download opens a new tab, long-press the image and Save</div>
  <div class="hint"><a href="index.html" style="color:var(--pill)">← back to pattyprix.xyz</a></div>

<script>
"use strict";
// visit + download beacons (Vercel-served domains only)
const TRACKED_HOST = /(\.vercel\.app|(^|\.)pattyprix\.xyz)$/.test(location.hostname);
if (TRACKED_HOST) fetch("/api/track?p=pfp", { method: "POST", keepalive: true }).catch(() => {});
const trackDl = () => { if (TRACKED_HOST) fetch("/api/track?p=pfp&e=dl", { method: "POST", keepalive: true }).catch(() => {}); };

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const frame = document.getElementById("frame");
const SIZE = 1024;

let img = null;
const G = { x: 0.5, y: 0.42, w: 0.74, rot: -4, flip: 1 }; // glasses, fractions of canvas

// If the original artwork exists as a transparent PNG at glasses.png,
// use it for a 1:1 match; otherwise draw the vector recreation below.
let glassesImg = null;
(() => {
  const im = new Image();
  im.onload = () => { glassesImg = im; render(); };
  im.onerror = () => {};
  im.src = "glasses.png";
})();

// the PATTYICE glasses: a single wraparound shield with diagonal
// white → pink → cyan → blue stripe bands and a pointed temple nub
function drawGlasses(c, cx, cy, w, rotDeg, flip) {
  c.save();
  c.translate(cx, cy);
  c.rotate(rotDeg * Math.PI / 180);
  c.scale(flip || 1, 1);

  if (glassesImg) {
    const h = w * glassesImg.naturalHeight / glassesImg.naturalWidth;
    c.drawImage(glassesImg, -w / 2, -h / 2, w, h);
    c.restore();
    return;
  }

  const h = w * 0.42;
  const lw = Math.max(w * 0.05, 10);
  const ink = "#17130E";
  const r = h * 0.34;

  const shield = () => {
    c.beginPath();
    c.moveTo(-w / 2 + r * 0.6, -h / 2);
    c.lineTo(w / 2 - r * 0.6, -h / 2);
    c.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
    c.lineTo(w / 2, h / 2 - r);
    c.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
    c.lineTo(-w / 2 + r, h / 2);
    c.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
    c.lineTo(-w / 2, -h / 2 + r * 0.7);
    c.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r * 0.6, -h / 2);
    c.closePath();
  };

  // pointed temple nub (left side, like the artwork)
  c.fillStyle = ink;
  c.beginPath();
  c.moveTo(-w * 0.48, -h * 0.34);
  c.lineTo(-w * 0.62, -h * 0.46);
  c.lineTo(-w * 0.48, -h * 0.06);
  c.closePath(); c.fill();

  // diagonal stripe bands, sampled from the artwork
  c.save();
  shield(); c.clip();
  c.save();
  c.rotate(-0.16); // stripes lean like the art
  const bands = [
    ["#FFFFFF", 0.13], ["#F4B9E5", 0.15], ["#EBDCF8", 0.05],
    ["#A5E3FA", 0.16], ["#66BDF4", 0.16], ["#4D8FE9", 0.17], ["#7ED9F8", 0.30]
  ];
  let bx = -w * 0.62;
  for (const [color, frac] of bands) {
    c.fillStyle = color;
    c.fillRect(bx, -h, w * frac * 1.3, h * 2.6);
    bx += w * frac * 1.3;
  }
  c.restore();
  // soft white glint top-left
  c.fillStyle = "rgba(255,255,255,0.5)";
  c.beginPath(); c.ellipse(-w * 0.30, -h * 0.26, w * 0.10, h * 0.14, -0.4, 0, 6.28); c.fill();
  c.restore();

  // frame outline
  shield();
  c.strokeStyle = ink; c.lineWidth = lw; c.lineJoin = "round"; c.stroke();
  c.restore();
}

function render() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  if (img) {
    const s = Math.max(SIZE / img.naturalWidth, SIZE / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    ctx.drawImage(img, (SIZE - dw) / 2, (SIZE - dh) / 2, dw, dh);
    drawGlasses(ctx, G.x * SIZE, G.y * SIZE, G.w * SIZE, G.rot, G.flip);
  } else {
    drawGlasses(ctx, SIZE * 0.5, SIZE * 0.45, SIZE * 0.55, -4, 1);
  }
}

document.getElementById("file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => {
    img = im;
    G.x = 0.5; G.y = 0.42; G.w = 0.74; G.rot = -4; G.flip = 1;
    document.getElementById("drop").hidden = true;
    document.getElementById("controls").hidden = false;
    document.getElementById("hint").hidden = false;
    render();
    URL.revokeObjectURL(url);
  };
  im.src = url;
});

// one finger drags, two fingers pinch to resize + tilt
const ptrs = new Map();
const rectPt = (e) => {
  const r = frame.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
};
frame.addEventListener("pointerdown", (e) => {
  if (!img) return;
  frame.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, rectPt(e));
});
frame.addEventListener("pointermove", (e) => {
  if (!img || !ptrs.has(e.pointerId)) return;
  const now = rectPt(e);
  if (ptrs.size === 1) {
    const was = ptrs.get(e.pointerId);
    G.x += now.x - was.x; G.y += now.y - was.y;
  } else if (ptrs.size === 2) {
    const ids = [...ptrs.keys()];
    const other = ptrs.get(ids[0] === e.pointerId ? ids[1] : ids[0]);
    const was = ptrs.get(e.pointerId);
    const d0 = Math.hypot(was.x - other.x, was.y - other.y);
    const d1 = Math.hypot(now.x - other.x, now.y - other.y);
    if (d0 > 0.001) G.w = Math.min(2, Math.max(0.15, G.w * d1 / d0));
    const a0 = Math.atan2(was.y - other.y, was.x - other.x);
    const a1 = Math.atan2(now.y - other.y, now.x - other.x);
    G.rot += (a1 - a0) * 180 / Math.PI;
  }
  ptrs.set(e.pointerId, now);
  render();
});
const lift = (e) => ptrs.delete(e.pointerId);
frame.addEventListener("pointerup", lift);
frame.addEventListener("pointercancel", lift);

document.getElementById("bigger").addEventListener("click", () => { G.w = Math.min(2, G.w * 1.1); render(); });
document.getElementById("smaller").addEventListener("click", () => { G.w = Math.max(0.15, G.w / 1.1); render(); });
document.getElementById("rotL").addEventListener("click", () => { G.rot -= 6; render(); });
document.getElementById("rotR").addEventListener("click", () => { G.rot += 6; render(); });
document.getElementById("flip").addEventListener("click", () => { G.flip *= -1; render(); });

document.getElementById("download").addEventListener("click", () => {
  render();
  trackDl();
  const a = document.createElement("a");
  a.download = "patty-pfp.png";
  a.href = cv.toDataURL("image/png");
  document.body.appendChild(a); a.click(); a.remove();
});

// preview shades on the empty card so the page never looks blank
render();

window.__pfp = { G, get hasImg() { return !!img; }, render };
</script>
</body>
</html>
