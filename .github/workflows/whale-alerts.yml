name: Whale Alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whale-alerts
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post whale buys to Telegram
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # --lookback matches the 15-minute cron so each buy alerts once.
        run: node scripts/whale-alerts.mjs --lookback 15 --min-usd 500
