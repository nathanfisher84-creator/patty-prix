name: Stats API Healthcheck

on:
  workflow_dispatch:
    inputs:
      token:
        description: "Optional token address — dump all of its DexScreener pools"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Race standings
        run: |
          node --input-type=module -e "
          const m = await import('./scripts/telegram-scoreboard.mjs');
          const all = [m.CONFIG.challenger, ...m.CONFIG.rivals];
          const byAddr = m.bestPairs(await m.fetchAllPairs(), all);
          console.log(m.buildMessage(byAddr).replace(/<[^>]+>/g, ''));
          console.log('--- address map ---');
          for (const a of all) {
            const p = byAddr[a.toLowerCase()];
            const mc = p && (p.marketCap ?? p.fdv);
            console.log(a.slice(0, 8) + '… = ' + (p ? p.baseToken.name + ' (' + p.baseToken.symbol + ') mcap ' + m.fmtUsd(mc) + ' · pool ' + p.dexId + ' liq ' + m.fmtUsd(p.liquidity?.usd ?? 0) : 'NOT FOUND'));
          }
          "

      - name: Token pools dump
        if: ${{ inputs.token != '' }}
        env:
          TOKEN: ${{ inputs.token }}
        run: |
          curl -sS "https://api.dexscreener.com/token-pairs/v1/solana/$TOKEN" | node --input-type=module -e "
          const chunks = []; for await (const c of process.stdin) chunks.push(c);
          const pairs = JSON.parse(Buffer.concat(chunks).toString());
          for (const p of pairs || []) {
            console.log([p.dexId, p.pairAddress, 'price ' + p.priceUsd, 'mcap ' + p.marketCap, 'fdv ' + p.fdv, 'liq ' + (p.liquidity?.usd ?? 0), 'vol24 ' + (p.volume?.h24 ?? 0)].join(' | '));
          }
          "

      - name: Check custom domain
        run: |
          echo "=== registry status (whois)"
          (sudo apt-get install -y whois > /dev/null 2>&1 || true)
          whois pattyprix.xyz | grep -iE "domain status|name server|creation date" | head -12 || echo "(whois unavailable)"
          echo "=== NS delegation seen by public DNS"
          dig +short NS pattyprix.xyz || true
          echo "=== NS records at the .xyz registry"
          dig +short NS pattyprix.xyz @x.nic.xyz || true
          echo "=== A record on Namecheap's own nameservers"
          dig +short pattyprix.xyz @dns1.registrar-servers.com || true
          echo "=== A record via public DNS (1.1.1.1)"
          dig +short pattyprix.xyz @1.1.1.1 || true
          for u in "https://pattyprix.xyz" "https://www.pattyprix.xyz"; do
            echo "=== $u"
            curl -sS -o /dev/null -m 20 -w "status %{http_code} · redirect to: %{redirect_url}\n" "$u" || true
          done
          echo "=== title served at pattyprix.xyz"
          curl -sSL -m 20 "https://pattyprix.xyz" | grep -o "<title>[^<]*</title>" || echo "(no title found)"
          echo "=== api via custom domain"
          curl -sS -m 20 "https://pattyprix.xyz/api/stats?q=ath" || true
          echo

      - name: Check visit tracking
        run: |
          echo "=== POST /api/track"
          curl -sS -o /dev/null -w "%{http_code}\n" -X POST -m 20 "https://pattyprix.xyz/api/track"
          echo "=== GET /api/visits"
          curl -sS -m 20 "https://pattyprix.xyz/api/visits"
          echo

      - name: Check game leaderboard
        run: |
          echo "=== GET /api/leaderboard"
          curl -sS -m 20 "https://pattyprix.xyz/api/leaderboard" | head -c 500
          echo
          echo "=== POST valid score"
          curl -sS -m 20 -X POST -H "content-type: application/json" \
            -d '{"name":"healthcheck","score":1200,"t":25}' \
            "https://pattyprix.xyz/api/leaderboard" | head -c 500
          echo
          echo "=== POST implausible score (expect 400)"
          curl -sS -o /dev/null -w "%{http_code}\n" -m 20 -X POST -H "content-type: application/json" \
            -d '{"name":"healthcheck","score":900000,"t":10}' \
            "https://pattyprix.xyz/api/leaderboard"

      - name: Check stats API endpoints
        run: |
          for q in supply ath; do
            echo "=== q=$q"
            curl -sS -m 20 "https://pattyprix.xyz/api/stats?q=$q" | head -c 400
            echo; echo
          done
          echo "=== q=holders (truncated)"
          curl -sS -m 30 "https://pattyprix.xyz/api/stats?q=holders&page=1" | head -c 250
          echo; echo
          echo "=== q=airdrop (truncated)"
          curl -sS -m 30 "https://pattyprix.xyz/api/stats?q=airdrop" | head -c 300
          echo

      - name: Check holder counts per token
        run: |
          node --input-type=module -e "
          const m = await import('./scripts/telegram-scoreboard.mjs');
          for (const a of [m.CONFIG.challenger, ...m.CONFIG.rivals]) {
            const r = await fetch('https://pattyprix.xyz/api/stats?q=holderCount&token=' + a);
            console.log(a.slice(0, 8) + '… → ' + r.status + ' ' + (await r.text()).slice(0, 120));
            await new Promise(res => setTimeout(res, 1100));
          }
          "
