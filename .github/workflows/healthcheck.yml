name: Stats API Healthcheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Race standings
        run: |
          node --input-type=module -e "
          const m = await import('./scripts/telegram-scoreboard.mjs');
          const all = [m.CONFIG.challenger, ...m.CONFIG.rivals];
          const pairs = await (await fetch('https://api.dexscreener.com/tokens/v1/solana/' + all.join(','))).json();
          const byAddr = m.bestPairs(pairs, all);
          console.log(m.buildMessage(byAddr).replace(/<[^>]+>/g, ''));
          console.log('--- address map ---');
          for (const a of all) {
            const p = byAddr[a.toLowerCase()];
            const mc = p && (p.marketCap ?? p.fdv);
            console.log(a.slice(0, 8) + '… = ' + (p ? p.baseToken.name + ' (' + p.baseToken.symbol + ') mcap ' + m.fmtUsd(mc) : 'NOT FOUND'));
          }
          "

      - name: Check stats API endpoints
        run: |
          for q in supply ath; do
            echo "=== q=$q"
            curl -sS -m 20 "https://patty-prix.vercel.app/api/stats?q=$q" | head -c 400
            echo; echo
          done
          echo "=== q=holders (truncated)"
          curl -sS -m 30 "https://patty-prix.vercel.app/api/stats?q=holders&page=1" | head -c 250
          echo; echo
          echo "=== q=airdrop (truncated)"
          curl -sS -m 30 "https://patty-prix.vercel.app/api/stats?q=airdrop" | head -c 300
          echo
