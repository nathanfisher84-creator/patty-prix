name: Web Probe

# The sandbox that develops this site can't reach arbitrary domains, but
# these runners can. This workflow visits a URL with a real browser,
# captures full-page screenshots (desktop + mobile, plus a delayed shot
# so animations show movement), saves the rendered DOM, the raw source,
# and the list of every loaded resource — then pushes it all to the
# probe-results branch for the sandbox to pull and analyze.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to capture"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null
          npm i playwright@1.49.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1

      - name: Capture the page
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p /tmp/probe
          cd /tmp/pw
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url = process.env.URL;
          const out = '/tmp/probe';
          const browser = await chromium.launch();

          const resources = [];
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          page.on('response', (r) => {
            try {
              resources.push({ url: r.url(), type: r.request().resourceType(), status: r.status(), ct: r.headers()['content-type'] || '' });
            } catch {}
          });

          // raw source before any JS runs
          try {
            const raw = await (await fetch(url)).text();
            fs.writeFileSync(out + '/source.html', raw);
          } catch (e) { fs.writeFileSync(out + '/source.html', 'fetch failed: ' + e); }

          await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
          await page.waitForTimeout(2500);
          await page.screenshot({ path: out + '/desktop-full.png', fullPage: true });
          await page.screenshot({ path: out + '/desktop-viewport-t0.png' });
          await page.waitForTimeout(1500); // animations move between these two
          await page.screenshot({ path: out + '/desktop-viewport-t1.png' });

          // scroll down a couple of viewports for mid-page animation states
          await page.evaluate(() => window.scrollTo(0, window.innerHeight * 1.5));
          await page.waitForTimeout(1200);
          await page.screenshot({ path: out + '/desktop-scrolled.png' });

          fs.writeFileSync(out + '/dom.html', await page.content());

          const mob = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          await mob.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
          await mob.waitForTimeout(2500);
          await mob.screenshot({ path: out + '/mobile-full.png', fullPage: true });

          fs.writeFileSync(out + '/resources.json', JSON.stringify({ url, when: new Date().toISOString(), resources }, null, 2));
          await browser.close();
          EOF
          node probe.mjs
          ls -la /tmp/probe

      - name: Push results to the probe-results branch
        env:
          URL: ${{ inputs.url }}
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/probe
          git init -b probe-results > /dev/null
          git config user.email "actions@github.com"
          git config user.name "web-probe"
          git add -A
          git commit -m "probe: $URL" -m "captured by the Web Probe workflow" > /dev/null
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-results
