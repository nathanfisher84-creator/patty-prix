name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # While vercel.json holds the maintenance redirect, the mirror goes
      # dark too — it publishes only the pit-stop page. Reverting the
      # pause commit restores the full mirror automatically.
      - name: Stage site
        run: |
          mkdir -p /tmp/site
          if [ -f vercel.json ] && grep -q "maintenance" vercel.json; then
            cp maintenance.html /tmp/site/index.html
          else
            rsync -a --exclude ".git" ./ /tmp/site/
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
