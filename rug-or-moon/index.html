<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rug or Moon — Solana token safety scanner</title>
<meta name="description" content="Scan any Solana token for rug red flags and smart-money signals before you ape. Not financial advice." />
<meta name="theme-color" content="#0b0f17" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#0b0f17; --card:#141a26; --card2:#1b2333; --line:#26314a;
    --txt:#e8edf7; --dim:#8a97b1; --red:#ff5c72; --yellow:#ffcc4d; --green:#39d98a; --accent:#8b7bff;
    --w:520px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:var(--w);margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
  header img{width:34px;height:34px}
  header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
  header .tag{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .search{display:flex;gap:8px}
  .search input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;
    padding:14px 14px;font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search button{background:var(--accent);color:#0b0f17;border:0;border-radius:12px;padding:0 18px;font-weight:800;font-size:15px}
  .hint{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  .verdict{display:flex;align-items:center;gap:16px}
  .ring{--p:0;--c:var(--dim);width:96px;height:96px;border-radius:50%;flex:0 0 96px;display:grid;place-items:center;
    background:conic-gradient(var(--c) calc(var(--p)*1%), #26314a 0);position:relative}
  .ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
  .ring b{position:relative;font-size:26px;font-weight:800}
  .ring small{position:relative;color:var(--dim);font-size:10px;display:block;text-align:center;margin-top:-4px}
  .verdict .v h2{margin:0;font-size:22px}
  .verdict .v p{margin:4px 0 0;color:var(--dim);font-size:13.5px}
  .sym{font-weight:700}
  .market{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .market div{font-size:13px;color:var(--dim)}
  .market b{display:block;color:var(--txt);font-size:15px;font-weight:700}
  .flags{list-style:none;margin:14px 0 0;padding:0}
  .flags li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 9px}
  .red .dot{background:var(--red)} .yellow .dot{background:var(--yellow)} .green .dot{background:var(--green)}
  .alpha{margin-top:16px}
  .alpha h3{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .alpha .sig{font-size:14px;padding:6px 0;color:var(--txt)}
  .buy{display:block;text-align:center;background:linear-gradient(90deg,#39d98a,#22b8ff);color:#04121a;
    font-weight:800;border-radius:12px;padding:14px;margin-top:16px;text-decoration:none}
  .disc{color:var(--dim);font-size:11.5px;margin-top:16px;line-height:1.5}
  .msg{color:var(--dim);text-align:center;padding:30px 10px}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
  @keyframes s{to{transform:rotate(360deg)}}
  .warn{color:var(--yellow);font-size:12.5px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon.svg" alt="" />
    <h1>Rug or Moon</h1>
    <span class="tag">Solana</span>
  </header>

  <div class="search">
    <input id="q" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false"
      placeholder="Paste a token address…" />
    <button id="go">Scan</button>
  </div>
  <p class="hint">Check rug red flags + smart-money signals before you ape. Heuristic, not advice.</p>

  <div id="out"></div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const out = $("#out"), q = $("#q"), go = $("#go");

// Configure your Jupiter referral to earn a fee on swaps routed from the app.
const JUP_REFERRAL = ""; // e.g. "?referrer=<yourRefKey>&feeBps=50"

const usd = n => n==null ? "—" : n>=1e9?"$"+(n/1e9).toFixed(2)+"B":n>=1e6?"$"+(n/1e6).toFixed(2)+"M":n>=1e3?"$"+(n/1e3).toFixed(1)+"K":"$"+(+n).toFixed(2);
const VERDICT = {
  clean:{emoji:"✅",label:"Looks clean",c:"var(--green)"},
  caution:{emoji:"⚠️",label:"Caution",c:"var(--yellow)"},
  "high-risk":{emoji:"🚩",label:"High risk",c:"var(--red)"},
};

async function scan(){
  const token = q.value.trim();
  if(!token){ q.focus(); return; }
  out.innerHTML = `<div class="card msg"><span class="spin"></span> Scanning on-chain…</div>`;
  history.replaceState(null,"",location.pathname+"?token="+encodeURIComponent(token));
  try{
    const r = await fetch("/api/scan?token="+encodeURIComponent(token));
    const d = await r.json();
    if(d.error){ out.innerHTML = `<div class="card msg">⚠️ ${d.error}</div>`; return; }
    render(d, token);
  }catch(e){
    out.innerHTML = `<div class="card msg">Couldn't reach the scanner. Try again.</div>`;
  }
}

function render(d, token){
  const v = VERDICT[d.tier] || VERDICT.caution;
  const m = d.market || {};
  const flags = (d.flags||[]).map(f=>`<li class="${f.level}"><span class="dot"></span><span>${esc(f.text)}</span></li>`).join("");
  const sigs = (d.alpha?.signals||[]).map(s=>`<div class="sig">• ${esc(s)}</div>`).join("") || `<div class="sig" style="color:var(--dim)">No standout smart-money or momentum signals.</div>`;
  const jup = `https://jup.ag/swap/SOL-${encodeURIComponent(token)}${JUP_REFERRAL}`;
  out.innerHTML = `
    <div class="card">
      <div class="verdict">
        <div class="ring" style="--p:${d.safety};--c:${v.c}"><div><b>${d.safety}</b><small>/100</small></div></div>
        <div class="v">
          <h2>${v.emoji} ${v.label}</h2>
          <p>${m.symbol?`<span class="sym">$${esc(m.symbol)}</span> · `:""}safety score</p>
        </div>
      </div>
      ${m.symbol||m.liquidityUsd!=null?`<div class="market">
        <div>Price<b>${m.priceUsd!=null?usd(m.priceUsd):"—"}</b></div>
        <div>Liquidity<b>${usd(m.liquidityUsd)}</b></div>
        <div>24h Vol<b>${usd(m.volume24h)}</b></div>
        <div>Mkt Cap<b>${usd(m.mcap)}</b></div>
      </div>`:""}
      ${!d.dataComplete?`<p class="warn">⚠️ Authority checks unavailable (scanner not configured with an RPC key) — safety based on market data only.</p>`:""}
      <ul class="flags">${flags||`<li class="yellow"><span class="dot"></span><span>Not enough data to assess.</span></li>`}</ul>
      <div class="alpha">
        <h3>Alpha signals · ${d.alpha?.score??0}/100</h3>
        ${sigs}
      </div>
      <a class="buy" href="${jup}" target="_blank" rel="noopener">Buy on Jupiter ↗</a>
      <p class="disc">${esc(d.disclaimer||"Heuristic estimate. Not financial advice.")}</p>
    </div>`;
}

const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
go.onclick = scan;
q.addEventListener("keydown", e=>{ if(e.key==="Enter") scan(); });

// Deep-link support: /?token=... scans on load (great for shared links).
const pre = new URLSearchParams(location.search).get("token");
if(pre){ q.value = pre; scan(); }

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
